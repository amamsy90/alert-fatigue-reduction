version: 2
updates:
  # uv, not pip: the pip updater edits pyproject.toml but not uv.lock, so its
  # pull requests fail `uv sync --locked` in CI.
  - package-ecosystem: uv
    directory: /app
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

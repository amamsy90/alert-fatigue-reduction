name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Tag is listed in CHANGELOG
        run: |
          tag="${GITHUB_REF_NAME#v}"
          grep -F "[$tag]" CHANGELOG.md
      - name: Build the image
        run: docker build -t oncall-queue:${GITHUB_REF_NAME} -t oncall-queue:latest app
      - name: Publish to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          image="ghcr.io/${{ github.repository }}"
          docker tag oncall-queue:${GITHUB_REF_NAME} "${image}:${GITHUB_REF_NAME}"
          docker tag oncall-queue:${GITHUB_REF_NAME} "${image}:latest"
          docker push "${image}:${GITHUB_REF_NAME}"
          docker push "${image}:latest"

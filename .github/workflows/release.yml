name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  # Lint, types, tests, report check, dependency audit and Docker health on the
  # tagged commit. A tag on a commit that fails any of them publishes nothing.
  checks:
    uses: ./.github/workflows/ci.yml

  # Build once, then scan it, list what is in it, deploy that exact image to a throwaway cluster
  # with the Helm chart and smoke-test it. Nothing is published unless every step passes.
  image:
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Tag is listed in CHANGELOG
        run: |
          tag="${GITHUB_REF_NAME#v}"
          grep -F "[$tag]" CHANGELOG.md
      - name: Tag matches the chart and the app version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          grep -qE "^appVersion: \"?$tag\"?$" app/deploy/helm/oncall-queue/Chart.yaml
          grep -qF "__version__ = \"$tag\"" app/product/__init__.py
      - name: Build the image
        run: docker build -t oncall-queue:${GITHUB_REF_NAME} -t oncall-queue:latest app
      - name: Scan the image for known vulnerabilities (HIGH and CRITICAL with a fix fail the release)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: oncall-queue:${{ github.ref_name }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Software bill of materials
        uses: anchore/sbom-action@v0.17.9
        with:
          image: oncall-queue:${{ github.ref_name }}
          format: spdx-json
          output-file: sbom.spdx.json
          artifact-name: sbom-${{ github.ref_name }}.spdx.json
      - name: Throwaway Kubernetes cluster
        uses: helm/kind-action@v1.10.0
        with:
          cluster_name: release-check
      - name: Deploy the built image with Helm and smoke-test it (rolls back on failure)
        env:
          ONCALL_PASSWORD: release-check-${{ github.run_id }}
          KUBE_CONTEXT: kind-release-check
          IMAGE_TAG: ${{ github.ref_name }}
          PYTHON: python3
        run: |
          kind load docker-image "oncall-queue:${GITHUB_REF_NAME}" --name release-check
          tools/deploy.sh release-check release-check             --set image.repository=oncall-queue --set image.pullPolicy=Never
      - name: Publish to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          image="ghcr.io/${{ github.repository }}"
          docker tag oncall-queue:${GITHUB_REF_NAME} "${image}:${GITHUB_REF_NAME}"
          docker tag oncall-queue:${GITHUB_REF_NAME} "${image}:latest"
          docker push "${image}:${GITHUB_REF_NAME}"
          docker push "${image}:latest"

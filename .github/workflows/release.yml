name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  # Lint, types, tests, report check, dependency audit and Docker health on the
  # tagged commit. A tag on a commit that fails any of them publishes nothing.
  checks:
    uses: ./.github/workflows/ci.yml

  # Build once, then scan it, list what is in it, deploy that exact image to a throwaway cluster
  # with the Helm chart and smoke-test it. Nothing is published unless every step passes.
  image:
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Tag is listed in CHANGELOG
        run: |
          tag="${GITHUB_REF_NAME#v}"
          grep -F "[$tag]" CHANGELOG.md
      - name: Tag matches the app version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          grep -qF "__version__ = \"$tag\"" app/product/__init__.py
          grep -qF "version = \"$tag\"" app/pyproject.toml
      - name: Build the image
        run: docker build -t oncall-queue:${GITHUB_REF_NAME} -t oncall-queue:latest app
      - name: Scan the image for known vulnerabilities (HIGH and CRITICAL with a fix fail the release)
        # Trivy runs from its container image, pinned to a version. The trivy-action wrapper pulled in a
        # second action (setup-trivy) whose tags had been removed, which stopped releases 1.2.1 and 1.2.2.
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.76.1 image --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 "oncall-queue:${GITHUB_REF_NAME}"
      - name: Software bill of materials
        uses: anchore/sbom-action@v0.17.9
        with:
          image: oncall-queue:${{ github.ref_name }}
          format: spdx-json
          output-file: sbom.spdx.json
          artifact-name: sbom-${{ github.ref_name }}.spdx.json
      - name: Container answers /health
        run: |
          docker run -d --name oq -p 8080:8080 oncall-queue:${GITHUB_REF_NAME}
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/health; then exit 0; fi
            sleep 1
          done
          docker logs oq
          exit 1
      - name: Publish to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          image="ghcr.io/${{ github.repository }}"
          docker tag oncall-queue:${GITHUB_REF_NAME} "${image}:${GITHUB_REF_NAME}"
          docker tag oncall-queue:${GITHUB_REF_NAME} "${image}:latest"
          docker push "${image}:${GITHUB_REF_NAME}"
          docker push "${image}:latest"

<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320" role="img" aria-labelledby="title1 desc1">
  <title id="title1">Faults caught versus daily budget K</title>
  <desc id="desc1">Shared queue (jumps first) catches 19.2%, 38.8%, 72.8%, and 86.0% at K=5, 10, 20, 50. Baseline is 0% at every budget.</desc>
  <rect width="640" height="320" fill="#ffffff"/>
  <text x="320" y="28" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#1c3a5c">Faults caught vs daily budget K (test period, 1,226 faults)</text>
  <g font-family="Arial, sans-serif" font-size="11" fill="#5c656d">
    <text x="48" y="60" text-anchor="end">100%</text>
    <text x="48" y="132" text-anchor="end">50%</text>
    <text x="48" y="204" text-anchor="end">0%</text>
  </g>
  <line x1="56" y1="56" x2="600" y2="56" stroke="#d7dde3"/>
  <line x1="56" y1="128" x2="600" y2="128" stroke="#d7dde3"/>
  <line x1="56" y1="200" x2="600" y2="200" stroke="#1c3a5c" stroke-width="1.5"/>
  <!-- K=5 19.2% -->
  <rect x="90" y="172.4" width="70" height="27.6" fill="#1c3a5c"/>
  <text x="125" y="166" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#1c3a5c">19.2%</text>
  <text x="125" y="220" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#2b3138">K=5</text>
  <!-- K=10 38.8% -->
  <rect x="220" y="144.1" width="70" height="55.9" fill="#1c3a5c"/>
  <text x="255" y="138" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#1c3a5c">38.8%</text>
  <text x="255" y="220" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#2b3138">K=10</text>
  <!-- K=20 72.8% -->
  <rect x="350" y="95.2" width="70" height="104.8" fill="#1c3a5c"/>
  <text x="385" y="89" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#1c3a5c">72.8%</text>
  <text x="385" y="220" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#2b3138">K=20</text>
  <!-- K=50 86.0% -->
  <rect x="480" y="76.2" width="70" height="123.8" fill="#1c3a5c"/>
  <text x="515" y="70" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#1c3a5c">86.0%</text>
  <text x="515" y="220" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#2b3138">K=50</text>
  <text x="320" y="250" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#2b3138">Daily items shown (jumps first)</text>
  <g font-family="Arial, sans-serif" font-size="12">
    <rect x="160" y="272" width="12" height="12" fill="#1c3a5c"/>
    <text x="178" y="283" fill="#2b3138">Shared queue</text>
    <line x1="310" y1="278" x2="334" y2="278" stroke="#1c3a5c" stroke-width="1.5"/>
    <text x="340" y="283" fill="#2b3138">Baseline 0% at every K</text>
  </g>
</svg>

{{- if not .Values.auth.existingSecret }}
{{- if and .Values.auth.requirePassword (not .Values.auth.password) }}
{{- fail "auth.password is required (or set auth.existingSecret). Use --set-string auth.password=... or a Secret you manage." }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "oncall.fullname" . }}
  labels:
    {{- include "oncall.labels" . | nindent 4 }}
type: Opaque
stringData:
  APP_USER: {{ .Values.auth.user | quote }}
  APP_PASSWORD: {{ .Values.auth.password | quote }}
  INGEST_TOKEN: {{ .Values.auth.ingestToken | quote }}
{{- end }}

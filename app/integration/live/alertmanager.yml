route:
  receiver: oncall-queue
  group_by: ["alertname", "service", "container"]
  group_wait: 5s
  group_interval: 30s
  repeat_interval: 2m

receivers:
  - name: oncall-queue
    webhook_configs:
      - url: http://app:8080/ingest/alertmanager
        send_resolved: false
        http_config:
          authorization:
            credentials: live-soak-token

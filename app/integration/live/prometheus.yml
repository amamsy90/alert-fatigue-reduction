global:
  scrape_interval: 10s
  evaluation_interval: 10s

rule_files:
  - /etc/prometheus/rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: fleet
    static_configs:
      - targets: ["fleet:9100"]
  - job_name: oncall-queue
    metrics_path: /metrics
    basic_auth:
      username: oncall
      password: live-soak-password
    static_configs:
      - targets: ["app:8080"]

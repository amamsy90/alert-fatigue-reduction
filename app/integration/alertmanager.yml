# Send every alert to the app's webhook, as a team's Alertmanager would.
route:
  receiver: oncall-queue
  group_by: ["alertname"]
  group_wait: 1s
  group_interval: 5s
  repeat_interval: 1h

receivers:
  - name: oncall-queue
    webhook_configs:
      # score_now=1 runs the ingest job at once, so the test can read the queue.
      - url: http://app:8080/ingest/alertmanager?score_now=1
        send_resolved: false
        http_config:
          authorization:
            credentials: integration-token

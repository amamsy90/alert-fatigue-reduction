[project]
name = "oncall-queue"
version = "1.2.1"
description = "Budgeted incident detection: a causal on-call queue of at most K items a day."
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "pandas>=2.2,<4",
    "numpy>=1.26,<3",
    "scikit-learn>=1.4,<2",
    "joblib>=1.3,<2",
    "fastapi>=0.110,<1",
    "uvicorn[standard]>=0.27,<1",
    "python-multipart>=0.0.9,<1",
    "httpx>=0.27,<1",
    "skops>=0.11,<1",
]

[dependency-groups]
dev = [
    "pytest>=7.0,<10",
    "pytest-cov>=5",
    "ruff>=0.6",
    "mypy>=1.10",
    "matplotlib>=3.8,<4",
    "seaborn>=0.13,<1",
    "pyarrow>=15,<26",
]
# Optional. `uv sync` and CI do not install this group. cuML is not pinned
# here: its wheels are CUDA-specific and come from the NVIDIA index.
# docs/GPU_LLM_ROLES.md has the install commands.
gpu = [
    "xgboost>=2.1,<4",
]
# llama-cpp-python is not a dependency of this group or of `dev`.
# Shadow notes import it only when LLM_EXPLAIN is on. See docs/GPU_LLM_ROLES.md.
# Optional metric model, ranker, trace model, LoRA notes and the contrastive
# encoder. `uv sync` and CI do not install this group. Torch, transformers,
# peft and torch_geometric are not pinned: the CPU wheel and the CUDA 13 wheel
# come from different indexes (the same reason cuML is not pinned). safetensors
# is the weight format. Install commands are in docs/ML_MODELS.md.
ml = [
    "safetensors>=0.4,<1",
]

[tool.uv]
# An application, not a library: `uv sync` installs the dependencies only.
package = false

[tool.pytest.ini_options]
# Tests import `src` and `product` from app/ without setting PYTHONPATH.
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "gpu: needs a CUDA device and the optional gpu libraries (skipped otherwise)",
    "ml: needs torch (skipped otherwise)",
]

[tool.coverage.run]
source = ["src", "product", "experiments/traces", "experiments/model_ablation"]
omit = [
    "product/datasets.py",  # downloads NAB over the network
    "*/metric_tcn.py",  # optional torch body; imported only when torch is installed
    "*/ranker_torch.py",
    "*/ranker_xgb.py",
    "*/trace_gnn.py",
    "*/log_encoder_torch.py",
    "*/run_*.py",  # experiment scripts moved under experiments/; they were never measured
    "*/train_*.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["data", "results", "examples/shop"]

[tool.ruff.lint]
# Errors, pyflakes, import order, bugbear and pyupgrade. Style nits are left to review.
select = ["E", "F", "W", "I", "B", "UP"]
ignore = [
    "E501",  # long lines: tables and messages read better unwrapped
    "B008",  # FastAPI's File(...) / Form(...) defaults are the documented pattern
    "B905",  # zip(strict=...): parallel lists are built together; strict would change behaviour
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]  # tests set env vars before importing the app

[tool.mypy]
python_version = "3.12"
files = ["src", "product", "experiments/traces/trace_eval.py", "experiments/traces/trace_gnn.py", "experiments/traces/trace_graph.py", "experiments/traces/trace_model.py", "experiments/model_ablation/model_eval.py"]
ignore_missing_imports = true
warn_unused_ignores = true
check_untyped_defs = false

[[tool.mypy.overrides]]
module = ["src.metric_tcn", "src.ranker_torch", "src.ranker_xgb", "experiments.traces.trace_gnn", "src.log_encoder_torch"]
ignore_errors = true

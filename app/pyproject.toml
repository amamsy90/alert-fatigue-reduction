[project]
name = "oncall-queue"
version = "1.0.0"
description = "Budgeted incident detection: a causal on-call queue of at most K items a day."
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "pandas>=2.2,<4",
    "numpy>=1.26,<3",
    "scikit-learn>=1.4,<2",
    "joblib>=1.3,<2",
    "fastapi>=0.110,<1",
    "uvicorn[standard]>=0.27,<1",
    "python-multipart>=0.0.9,<1",
    "httpx>=0.27,<1",
    "skops>=0.11,<1",
]

[dependency-groups]
dev = [
    "pytest>=7.0,<10",
    "pytest-cov>=5",
    "ruff>=0.6",
    "mypy>=1.10",
    "matplotlib>=3.8,<4",
    "seaborn>=0.13,<1",
    "pyarrow>=15,<22",
]

[tool.uv]
# An application, not a library: `uv sync` installs the dependencies only.
package = false

[tool.pytest.ini_options]
# Tests import `src` and `product` from app/ without setting PYTHONPATH.
pythonpath = ["."]
testpaths = ["tests"]

[tool.coverage.run]
source = ["src", "product"]
omit = ["product/datasets.py"]  # downloads NAB over the network

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["data", "results", "examples/shop"]

[tool.ruff.lint]
# Errors, pyflakes, import order, bugbear and pyupgrade. Style nits are left to review.
select = ["E", "F", "W", "I", "B", "UP"]
ignore = [
    "E501",  # long lines: tables and messages read better unwrapped
    "B008",  # FastAPI's File(...) / Form(...) defaults are the documented pattern
    "B905",  # zip(strict=...): parallel lists are built together; strict would change behaviour
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]  # tests set env vars before importing the app

[tool.mypy]
python_version = "3.12"
files = ["src", "product"]
ignore_missing_imports = true
warn_unused_ignores = true
check_untyped_defs = false
